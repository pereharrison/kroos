<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kroos - Add word</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  </head>
  <body>
    <button>
      <a href="./index.html"><i class="fa-regular fa-house"></i></a>
    </button>
    <form method="post" id="form">
      <div>
        <label for="kroos">Kroos</label>
        <input type="text" id="kroos" />
      </div>
      <div>
        <label for="english">English</label>
        <input type="text" id="english" />
      </div>
      <div>
        <label for="meaning">Meaning</label>
        <input type="text" id="meaning" />
      </div>
      <button type="submit">Submit word</button>
    </form>
    <div id="message"></div>
    <script>
      const form = document.getElementById("form");
      let kroos = document.getElementById("kroos");
      let english = document.getElementById("english");
      let meaning = document.getElementById("meaning");
      let message = document.getElementById("message")

      const url = "http://localhost:4000/word/add-word";

      form.addEventListener("submit", async (e) => {
        e.preventDefault()
          const wordData = {
            kroos: kroos.value,
            english: english.value,
            meaning: meaning.value,
          };
        try {

          const res = await axios.post(url, wordData)
          console.log(`${wordData.kroosVal} created.`)
          message.textContent = `${wordData.kroos} created successfully!`
        } catch (error) {
            console.error('Error creating user:', error);
            message.textContent = `Failed to create ${wordData.kroos}`
        }
      });
    </script>
  </body>
</html>
